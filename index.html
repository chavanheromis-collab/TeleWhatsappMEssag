<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp CRM Sender</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
}

.container{
background:white;
width:95%;
max-width:450px;
padding:25px;
border-radius:15px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:15px;
}

.image-box{
border-radius:12px;
overflow:hidden;
margin-bottom:20px;
}

.image-box img{
width:100%;
height:auto;
display:block;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
margin-top:10px;
color:white;
}

.offer{background:#25D366;}
.calling{background:#007bff;}
.missed{background:#ff5722;}

</style>
</head>

<body>

<div class="container">

<h2>WhatsApp CRM Sender</h2>

<div class="image-box">
<img id="offerImage">
</div>

<button class="offer" onclick="sendOffer()">Send Offer Message</button>

<button class="calling" onclick="sendCalling()">We Are Calling You</button>

<button class="missed" onclick="sendMissed()">Could Not Connect</button>

</div>

<script>

/* GOOGLE DRIVE FILE ID */
const fileId="10dhrdvtp8HB68JzLMicyFsRjcJADlY6A";

/* FAST PREVIEW LINK (same as your reference code) */
const imageURL=`https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;

/* Load preview instantly */
document.getElementById("offerImage").src=imageURL;

/* Get customer number from AppSheet */
const params=new URLSearchParams(window.location.search);
const customer=(params.get("cust")||"").replace(/\D/g,'');

/* OFFER MESSAGE */

function sendOffer(){

const message=`Hello,

Latest offers are available at Chavan Automobiles.

Please contact us for more details.

Thank you 😊`;

openWhatsApp(message);

}

/* CALLING MESSAGE */

function sendCalling(){

const message=`We are calling you regarding the special offer shared earlier.

Kindly take our call or let us know a suitable time.

आम्ही पाठवलेल्या विशेष ऑफर संदर्भात संपर्क करत आहोत.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}

/* MISSED CALL */

function sendMissed(){

const message=`We tried calling you regarding the special offer but couldn't connect.

Please share a convenient time to call.

विशेष ऑफर संदर्भात संपर्क साधण्याचा प्रयत्न केला परंतु संपर्क होऊ शकला नाही.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}

function openWhatsApp(text){

const url=`https://wa.me/${customer}?text=${encodeURIComponent(text)}`;
window.location.href=url;

}

</script>

</body>
</html>
