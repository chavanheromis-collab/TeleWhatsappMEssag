<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp CRM Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
width:95%;
max-width:500px;
padding:25px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
text-align:center;
}

h2{margin-bottom:15px;}

#message{
font-size:15px;
margin:10px 0;
min-height:50px;
}

#imagePreview{
width:100%;
border-radius:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
margin-top:10px;
color:white;
}

.offer{background:#25D366;}
.calling{background:#007bff;}
.missed{background:#ff5722;}

button:disabled{background:gray;}

.status{
margin-top:10px;
font-size:14px;
color:#555;
}

</style>
</head>

<body>

<div class="container">

<h2>WhatsApp CRM Sender</h2>

<img id="imagePreview">

<div id="message">Loading message...</div>

<button class="offer" onclick="sendOffer()">Send Offer + Image</button>

<button class="calling" onclick="sendCalling()">We Are Calling You</button>

<button class="missed" onclick="sendMissed()">Could Not Connect</button>

<div class="status" id="status"></div>

</div>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbyWk9-Dp72zjaX5syxmaem8rIIyTGy1sX3tSoAldCRDafg4pWZQoO1WV25xRP-F12DY/exec";

/* PASTE GOOGLE DRIVE FILE ID HERE */
const driveFileID="PASTE_FILE_ID";

/* Convert to preview */
const imageURL=`https://drive.google.com/uc?export=view&id=${driveFileID}`;

/* Show preview immediately */
document.getElementById("imagePreview").src=imageURL;


/* Get customer number */
const params=new URLSearchParams(window.location.search);
const customerNumber=(params.get("cust")||"").replace(/\D/g,'');

let sheetMessage="";

async function loadMessage(){

if(!customerNumber){
document.getElementById("message").innerText="Customer number missing.";
disableButtons();
return;
}

try{

const res=await fetch(scriptURL+"?cust="+customerNumber);
const data=await res.json();

sheetMessage=data.message || "Offer message unavailable";

document.getElementById("message").innerText=sheetMessage;

}catch(e){

document.getElementById("message").innerText="Unable to load message.";
disableButtons();

}

}

function disableButtons(){
document.querySelectorAll("button").forEach(b=>b.disabled=true);
}

function openWhatsApp(text){

const encoded=encodeURIComponent(text);
const url=`https://wa.me/${customerNumber}?text=${encoded}`;
window.open(url,"_blank");

}

async function markSent(){

try{

await fetch(scriptURL,{
method:"POST",
body:JSON.stringify({customer:customerNumber})
});

document.getElementById("status").innerText="Status Updated";

}catch{

document.getElementById("status").innerText="Update failed";

}

}

/* OFFER */
function sendOffer(){

const msg=`${sheetMessage}\n\n${imageURL}`;

openWhatsApp(msg);
markSent();

}

/* CALLING */

function sendCalling(){

const msg=`We are calling you regarding the special offer shared earlier.
Kindly take our call or let us know a suitable time.

आम्ही पाठवलेल्या विशेष ऑफर संदर्भात संपर्क करत आहोत.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(msg);
markSent();

}

/* MISSED */

function sendMissed(){

const msg=`We tried calling you regarding the special offer but couldn't connect.
Please share a convenient time to call.

विशेष ऑफर संदर्भात संपर्क साधण्याचा प्रयत्न केला परंतु संपर्क होऊ शकला नाही.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(msg);
markSent();

}

loadMessage();

</script>

</body>
</html>
