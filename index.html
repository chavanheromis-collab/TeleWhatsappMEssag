<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WhatsApp CRM Sender</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
width:95%;
max-width:500px;
padding:25px;
border-radius:12px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
text-align:center;
}

h2{margin-bottom:15px;}

#imagePreview{
width:100%;
border-radius:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
margin-top:10px;
color:white;
}

.offer{background:#25D366;}
.calling{background:#007bff;}
.missed{background:#ff5722;}

</style>
</head>

<body>

<div class="container">

<h2>WhatsApp CRM Sender</h2>

<img id="imagePreview">

<button class="offer" onclick="sendOffer()">Send Offer Message</button>

<button class="calling" onclick="sendCalling()">We Are Calling You</button>

<button class="missed" onclick="sendMissed()">Could Not Connect</button>

</div>

<script>

/* IMAGE PREVIEW */
const imageURL="https://drive.google.com/uc?export=view&id=10dhrdvtp8HB68JzLMicyFsRjcJADlY6A";
document.getElementById("imagePreview").src=imageURL;

/* Get customer number from AppSheet */
const params=new URLSearchParams(window.location.search);
const customerNumber=(params.get("cust")||"").replace(/\D/g,'');

/* Offer message */
function sendOffer(){

const message=`Latest Offer from Chavan Automobiles 🚀

Exclusive offers are available for Hero two-wheelers.

Contact us for more details.

Thank you 😊`;

openWhatsApp(message);

}

/* Calling message */
function sendCalling(){

const message=`We are calling you regarding the special offer shared earlier.

Kindly take our call or let us know a suitable time.

आम्ही पाठवलेल्या विशेष ऑफर संदर्भात संपर्क करत आहोत.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}

/* Missed message */
function sendMissed(){

const message=`We tried calling you regarding the special offer but couldn't connect.

Please share a convenient time to call.

विशेष ऑफर संदर्भात संपर्क साधण्याचा प्रयत्न केला परंतु संपर्क होऊ शकला नाही.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}

function openWhatsApp(text){

const encoded=encodeURIComponent(text);
const url=`https://wa.me/${customerNumber}?text=${encoded}`;
window.open(url,"_blank");

}

</script>

</body>
</html>
