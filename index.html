<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp CRM Sender</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
width:95%;
max-width:450px;
padding:25px;
border-radius:15px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
text-align:center;
}

h2{
margin-bottom:15px;
}

.image-box{
border-radius:12px;
overflow:hidden;
margin-bottom:20px;
}

.image-box img{
width:100%;
height:auto;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
margin-top:10px;
color:white;
}

.offer{background:#25D366;}
.calling{background:#007bff;}
.missed{background:#ff5722;}

</style>
</head>

<body>

<div class="container">

<h2>WhatsApp CRM Sender</h2>

<div class="image-box">
<img id="offerImage">
</div>

<button class="offer" onclick="sendOffer()">Send Offer Message</button>

<button class="calling" onclick="sendCalling()">We Are Calling You</button>

<button class="missed" onclick="sendMissed()">Could Not Connect</button>

</div>

<script>

/* GOOGLE SCRIPT URL */
const scriptURL="PASTE_YOUR_WEBAPP_URL_HERE";

/* DRIVE IMAGE FILE ID */
const fileId="10dhrdvtp8HB68JzLMicyFsRjcJADlY6A";

/* FAST IMAGE PREVIEW */
document.getElementById("offerImage").src=
`https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;

/* CUSTOMER NUMBER FROM APPSHEET */
const params=new URLSearchParams(window.location.search);
const customer=(params.get("cust")||"").replace(/\D/g,'');


/* SEND OFFER */

function sendOffer(){

fetch(scriptURL)
.then(res=>res.json())
.then(data=>{

if(!data.message){
alert("No pending messages");
return;
}

const message=data.message;
const row=data.row;

const url=`https://wa.me/${customer}?text=${encodeURIComponent(message)}`;

window.location.href=url;

/* UPDATE STATUS */

setTimeout(()=>{

fetch(scriptURL,{
method:"POST",
body:JSON.stringify({row:row})
});

},1500);

})
.catch(err=>{
console.log(err);
alert("Failed loading message");
});

}



/* CALLING MESSAGE */

function sendCalling(){

const message=`We are calling you regarding the special offer shared earlier.

Kindly take our call or let us know a suitable time.

आम्ही पाठवलेल्या विशेष ऑफर संदर्भात संपर्क करत आहोत.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}



/* MISSED MESSAGE */

function sendMissed(){

const message=`We tried calling you regarding the special offer but couldn't connect.

Please share a convenient time to call.

विशेष ऑफर संदर्भात संपर्क साधण्याचा प्रयत्न केला परंतु संपर्क होऊ शकला नाही.
कृपया योग्य वेळ कळवावी.

Thank you 😊`;

openWhatsApp(message);

}



function openWhatsApp(text){

if(!customer){
alert("Customer number missing");
return;
}

const url=`https://wa.me/${customer}?text=${encodeURIComponent(text)}`;
window.location.href=url;

}

</script>

</body>
</html>
